excluded:
  - build
  - "**/.build"
  - "**/*.xcodeproj"
opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
disabled_rules:
  - todo              # 代わりに common の「TODO 放置禁止」で運用
  - line_length       # swiftformat の maxwidth に任せる
force_cast: error
force_try: error
force_unwrapping: error
identifier_name:
  min_length: 2
  excluded: [id, db, x, y]
type_body_length:
  warning: 300
  error: 500
file_length:
  warning: 500
  error: 800
custom_rules:
  no_print:
    regex: '^\s*print\('
    message: "print は使わない。os.Logger を使う"
    severity: error
  domain_no_ui_import:
    included: "Packages/Domain/.*\\.swift"
    regex: '^import (SwiftUI|AppKit|UIKit)'
    message: "Domain は UI フレームワークに依存しない"
    severity: error
