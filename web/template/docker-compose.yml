services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: dev
    environment:
      APP_ENV: local
      APP_PORT: "8080"
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      AUTH_ACCESS_TOKEN_TTL: 15m
      AUTH_REFRESH_TOKEN_TTL: 720h
      AUTH_SIGNING_KEY: local-dev-only-not-a-secret
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
